name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "python/**"
      - "third_party/**"
      - ".github/workflows/wheels.yml"

permissions:
  contents: read

# Release artifacts are built on ubuntu-latest only.  The shared library is
# produced by the same CMake sources that CI tests; publishing macOS/Windows
# wheels is a separate decision that needs its own runner budget.

jobs:
  build_wheels:
    name: manylinux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
