[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rflux"
version = "0.4.2"
description = "Stable C ABI + C++17 + Python quantitative research algorithms"
readme = {text = "rflux: factors, Gaussian HMM regimes, correlation graphs, percolation and risk diffusion. C ABI + C++17 core + Python.", content-type = "text/plain"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "cxy2696"}]
maintainers = [{name = "cxy2696"}]
keywords = ["quantitative-finance", "factors", "hmm", "percolation", "graph", "backtesting"]
dependencies = ["numpy>=1.23"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/cxy2696/rflux"
Documentation = "https://github.com/cxy2696/rflux#documentation"
Repository = "https://github.com/cxy2696/rflux"
Issues = "https://github.com/cxy2696/rflux/issues"

[project.scripts]
rflux = "rflux.cli:main"

[project.optional-dependencies]
data = ["pandas>=1.5"]
akshare = ["pandas>=1.5", "akshare>=1.12"]
yfinance = ["pandas>=1.5", "yfinance>=0.2.40"]
all = ["pandas>=1.5", "akshare>=1.12", "yfinance>=0.2.40"]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["rflux"]
include-package-data = true

[tool.setuptools.package-data]
rflux = ["_lib/*", "py.typed"]
